<app-page-layout>
  <header class="flex flex-col">
    <div class="mb-4">
      <button hlmBtn variant="outline" routerLink="/record-workout" [queryParams]="{ workoutId: workoutId }">
        <ng-icon data-icon="inline-start" name="lucideArrowLeft" />
        <span>{{ 'WORKOUTS.BACK_RECORD_WORKOUT' | translate }}</span>
      </button>
    </div>
    <div class="flex items-center justify-between mb-4">
      <app-page-header [title]="'EXERCISES.TITLE' | translate" />
    </div>
  </header>

  <section class="flex w-full flex-col">
    <p *ngIf="loadError()"
        role="alert"
        class="mb-4 text-sm text-destructive">
      {{ loadError() }}
    </p>

    <p *ngIf="saveError()" role="alert" class="mb-4 text-sm text-destructive">{{ saveError() }}</p>
    <p *ngIf="isSaving()" role="status" class="mb-4 text-sm text-muted-foreground">{{ 'RECORD_WORKOUT.ADDING' | translate }}</p>

    <p *ngIf="isLoading()"
        class="mb-4 text-sm text-muted-foreground">
      {{ 'EXERCISES.LOADING' | translate }}
    </p>

    <p *ngIf="!isLoading() && !loadError() && exercises().length === 0"
        class="mb-4 text-sm text-muted-foreground">
      {{ 'EXERCISES.EMPTY' | translate }}
    </p>

    <div *ngIf="!isLoading() && !loadError()" class="grid gap-3">
      <button hlmCard type="button" (click)="addExercise(exercise.id)" [disabled]="isSaving() || !workoutId"
              *ngFor="let exercise of exercises()"
              class="cursor-pointer p-4 text-left transition-colors hover:bg-accent focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring disabled:cursor-wait disabled:opacity-50">
        <h2 class="text-md font-medium">
          {{ exercise.name }}
        </h2>
      </button>
    </div>
  </section>
</app-page-layout>
