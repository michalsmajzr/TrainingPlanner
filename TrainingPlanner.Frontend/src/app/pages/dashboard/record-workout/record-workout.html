<app-page-layout>
  <header class="flex flex-col">
    <div class="mb-4">
      <button hlmBtn variant="outline" routerLink="/dashboard">
        <ng-icon data-icon="inline-start" name="lucideArrowLeft" />
        <span>{{ 'WORKOUTS.BACK_TO_DASHBOARD' | translate }}</span>
      </button>
    </div>
    <div class="flex items-center justify-between mb-4">
      <app-page-header [title]="'EXERCISES.TITLE' | translate" />
    </div>
  </header>

  <section class="max-w-md">
    @if (isCreating()) {
    <p role="status">{{ 'RECORD_WORKOUT.STARTING' | translate }}</p>
    }

    @for (exercise of exercises(); track exercise.id) {
    <section hlmCard class="mb-3 p-4">
      <h2 class="text-md font-medium">{{ exercise.name }}</h2>
    </section>
    }

    @if (workoutId()) {
    <a hlmCard
       routerLink="/record-workout/add-exercise"
       [queryParams]="{ workoutId: workoutId() }"
       class="flex items-center justify-center gap-3 border-dashed p-3 transition-colors hover:bg-accent">
      <span class="font-medium">{{ 'RECORD_WORKOUT.ADD_EXERCISE' | translate }}</span>
    </a>
    }
    @if (errorMessage()) {
    <p role="alert" class="text-sm text-destructive">{{ errorMessage() }}</p>
    }
  </section>
</app-page-layout>
