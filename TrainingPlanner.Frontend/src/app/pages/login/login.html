<main class="mx-auto min-h-screen max-w-5xl flex items-center justify-center p-6">
    <section hlmCard class="w-full max-w-md space-y-3 p-8">
        <header>
            <h1 class="text-2xl font-bold">Přihlášení</h1>
        </header>

        @if (error(); as message) {
        <p role="alert" class="text-sm text-destructive">{{ message }}</p>
        }

        <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-5">
            <div class="space-y-2">
                <label hlmLabel for="login-email">Email</label>
                <input hlmInput id="login-email" type="email" formControlName="email" autocomplete="email" />
                @if (form.controls.email.touched && form.controls.email.invalid) {
                <p class="text-sm text-destructive">Zadej platný email.</p>
                }
            </div>

            <div class="space-y-2">
                <label hlmLabel for="login-password">Heslo</label>
                <input hlmInput id="login-password" type="password" formControlName="password"
                    autocomplete="current-password" />
                @if (form.controls.password.touched && form.controls.password.invalid) {
                <p class="text-sm text-destructive">Zadej heslo.</p>
                }
            </div>

            <button hlmBtn class="w-full cursor-pointer" type="submit" [disabled]="submitting()">
                {{ submitting() ? 'Přihlašuji…' : 'Přihlásit se' }}
            </button>
        </form>

        <p class="text-sm text-center text-muted-foreground">
            Nemáte účet?
            <a class="underline" routerLink="/register">Zaregistrujte se</a>
        </p>
    </section>
</main>
