<app-page-layout>
  <header class="flex flex-col">
    <app-language-switcher />
    <div class="flex items-center justify-between mb-4">
      <app-page-header [title]="'DASHBOARD.TITLE' | translate" />
      <button hlmBtn routerLink="/record-workout">{{ 'DASHBOARD.RECORD_WORKOUT' | translate }}</button>
    </div>
  </header>

  <p *ngIf="loadError()"
      role="alert"
      class="mb-4 text-sm text-destructive">
    {{ loadError() }}
  </p>

  <p *ngIf="isLoading()"
      class="mb-4 text-sm text-muted-foreground">
    {{ 'DASHBOARD.LOADING' | translate }}
  </p>

  <p *ngIf="!isLoading() && !loadError() && workouts().length === 0"
      class="mb-4 text-sm text-muted-foreground">
    {{ 'DASHBOARD.EMPTY' | translate }}
  </p>

  <div class="grid gap-3">
    <div hlmCard
          *ngFor="let workout of workouts()"
          class="relative p-4 transition-colors hover:bg-accent">
      <a [routerLink]="['/record-workout']"
          [queryParams]="{ workoutId: workout.id }"
          class="absolute inset-0 rounded-[inherit]">
        <span class="sr-only">
          {{ 'DASHBOARD.GO_TO' | translate }}
          {{ workout.startedAt | date : 'dd.MM.yyyy HH:mm' }}
        </span>
      </a>

      <div class="pointer-events-none">
        <h2 class="text-lg font-medium">
          {{ workout.startedAt | date : 'dd.MM.yyyy' }}
        </h2>

        <p class="text-sm text-muted-foreground">
          {{ workout.startedAt | date : 'HH:mm' }}
          {{ workout.exerciseCount }}
        </p>
      </div>
    </div>
  </div>
</app-page-layout>
