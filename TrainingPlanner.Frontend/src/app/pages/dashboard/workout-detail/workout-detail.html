<main class="mx-auto flex min-h-screen max-w-5xl p-6">
    <section class="flex flex-col w-full p-6">
        <div class="mb-4">
            <button hlmBtn variant="outline" routerLink="/dashboard" class="cursor-pointer">
                <ng-icon data-icon="inline-start" name="lucideArrowLeft" />
                <span>Zpět na dashboard</span>
            </button>
        </div>

        @if (loadError()) {
        <p role="alert" class="mb-4 text-sm text-destructive">{{ loadError() }}</p>
        }

        @if (isLoading()) {
        <p class="mb-4 text-sm text-muted-foreground">Načítám trénink...</p>
        }

        @if (workout(); as w) {
        <section hlmCard class="p-6">
            <h1 class="text-3xl font-bold">{{ w.name }}</h1>
        </section>
        }
    </section>
</main>
