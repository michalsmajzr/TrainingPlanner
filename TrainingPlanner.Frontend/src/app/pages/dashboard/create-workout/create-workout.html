<main class="mx-auto flex min-h-screen max-w-5xl p-6">
    <section class="p-6">
        <h1 class="text-2xl font-semibold mb-4">Create workout</h1>

        <form [formGroup]="form" (ngSubmit)="submit()" class="grid gap-3 max-w-md">
            <input type="text" formControlName="name" placeholder="Workout name" />
            <input type="datetime-local" formControlName="date" />
            <button hlmBtn type="submit">Save</button>
        </form>
    </section>
</main>
