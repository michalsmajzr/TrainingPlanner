<main class="mx-auto flex min-h-screen max-w-5xl p-6">
    <section class="flex flex-col w-full p-6">
        <div class="flex items-center justify-between gap-4 mb-4">
            <h1 class="text-3xl font-bold">Dashboard</h1>
            <a hlmBtn routerLink="/create-workout">Vytvořit trénink</a>
        </div>


        <p *ngIf="loadError()" role="alert" class="mb-4 text-sm text-destructive">
            {{ loadError() }}
        </p>

        <p *ngIf="isLoading()" class="mb-4 text-sm text-muted-foreground">
            Načítám tréninky...
        </p>

        <p *ngIf="!isLoading() && !loadError() && workouts().length === 0" class="mb-4 text-sm text-muted-foreground">
            Zatím nemáte žádné tréninky.
        </p>

        <div class="grid gap-3">
            <div hlmCard *ngFor="let w of workouts()" class="relative p-4 transition-colors hover:bg-accent">
                <a [routerLink]="['/dashboard', w.id]" class="absolute inset-0 rounded-[inherit]">
                    <span class="sr-only">Přejít na trénink {{ w.name }}</span>
                </a>

                <div class="flex items-center justify-between w-full">
                    <div class="pointer-events-none">
                        <h2 class="text-lg font-medium">{{ w.name }}</h2>
                        <p class="text-sm text-muted-foreground">{{ w.date | date : 'short' }}</p>
                    </div>

                    <div class="relative z-10">
                        <hlm-alert-dialog [closeOnOutsidePointerEvents]="true">
                            <button hlmAlertDialogTrigger hlmBtn variant="destructive" size="sm" class="cursor-pointer"
                                [disabled]="deletingWorkoutId() === w.id">
                                Smazat
                            </button>
                            <hlm-alert-dialog-content *hlmAlertDialogPortal="let ctx">
                                <hlm-alert-dialog-header>
                                    <h2 hlmAlertDialogTitle>Opravdu chcete smazat tento trénink?</h2>
                                    <p hlmAlertDialogDescription>
                                        Tato akce je nevratná. Trénink &bdquo;{{ w.name }}&ldquo; bude trvale odstraněn.
                                    </p>
                                </hlm-alert-dialog-header>
                                <hlm-alert-dialog-footer>
                                    <button hlmAlertDialogCancel class="cursor-pointer">Zrušit</button>
                                    <button hlmAlertDialogAction variant="destructive" class="cursor-pointer"
                                        (click)="deleteWorkout(w.id); ctx.close()">
                                        Smazat
                                    </button>
                                </hlm-alert-dialog-footer>
                            </hlm-alert-dialog-content>
                        </hlm-alert-dialog>
                    </div>
                </div>
            </div>
        </div>
    </section>
</main>
