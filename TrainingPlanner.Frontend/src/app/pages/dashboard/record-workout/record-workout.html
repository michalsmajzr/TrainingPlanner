<main class="mx-auto flex min-h-screen max-w-5xl p-6">
  <section class="p-6 w-full max-w-md">
    <div class="mb-4">
      <button hlmBtn variant="outline" routerLink="/dashboard" class="cursor-pointer">
        <ng-icon data-icon="inline-start" name="lucideArrowLeft" />
        <span>{{ 'WORKOUTS.BACK_TO_DASHBOARD' | translate }}</span>
      </button>
    </div>

    <section class="flex w-full flex-col">
      <div class="mb-4 flex items-center justify-between gap-4">
        <h1 class="text-3xl font-bold">
          {{ 'EXERCISES.TITLE' | translate }}
        </h1>
      </div>

      <p *ngIf="loadError()"
         role="alert"
         class="mb-4 text-sm text-destructive">
        {{ loadError() }}
      </p>

      <p *ngIf="isLoading()"
         class="mb-4 text-sm text-muted-foreground">
        {{ 'EXERCISES.LOADING' | translate }}
      </p>

      <p *ngIf="!isLoading() && !loadError() && exercises().length === 0"
         class="mb-4 text-sm text-muted-foreground">
        {{ 'EXERCISES.EMPTY' | translate }}
      </p>

      <div *ngIf="!isLoading() && !loadError()" class="grid gap-3">
        <div hlmCard
             *ngFor="let exercise of exercises()"
             class="p-4">
          <h2 class="text-md font-medium">
            {{ exercise.name }}
          </h2>
        </div>
      </div>
    </section>
  </section>
</main>
